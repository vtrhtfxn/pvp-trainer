name: Desktop app

# Builds the desktop apps on every push (and checks the Mac app starts on a real Mac), and on
# every push to main publishes them as a GitHub Release. The app downloads new game builds from the
# latest release by itself (electron/main.cjs), so it only has to be installed once:
#   https://github.com/vtrhtfxn/pvp-trainer/releases/latest/download/PvP-Trainer-mac.zip
on:
  push:
    # Only main publishes a release; claude/* branches are built and checked (not published).
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx tsc --noEmit
      - run: npx vitest run

  app:
    needs: test
    runs-on: macos-14
    timeout-minutes: 40
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the game
        run: |
          npm run build
          node -e "require('fs').writeFileSync('dist/build.json', JSON.stringify({ build: Number(process.env.BUILD), shell: require('./electron/shell-version.json').shell }))"
          cat dist/build.json

      - name: Package the Mac app (universal — Apple silicon and Intel)
        run: node electron/build-app.mjs --universal

      - name: Sign (ad-hoc) and verify
        run: |
          APP="$(find dist-app -maxdepth 2 -name 'PvP Trainer.app' -print -quit)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Smoke test — the app starts and the game loads
        env:
          # The runner is a VM that may have no GPU: see smokeTest() in electron/main.cjs.
          PVP_SMOKE_NO_GPU_OK: '1'
        run: |
          "$APP/Contents/MacOS/PvP Trainer" --smoke-test 2>&1 | tee smoke.log
          grep -q '^SMOKE OK' smoke.log

      - name: Zip the Mac app
        run: ditto -c -k --sequesterRsrc --keepParent "$APP" PvP-Trainer-mac.zip

      - name: Package the Windows app
        run: |
          node electron/build-app.mjs --win
          mv "dist-app/PvP Trainer (Windows).zip" PvP-Trainer-windows.zip

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/index.html game.html
          cp dist/build.json build.json
          MSG="$(git log -1 --pretty=%s)"
          cat > notes.md <<NOTES
          **$MSG**

          ### Install (once)
          - **Mac:** download **PvP-Trainer-mac.zip**, open it, and drag **PvP Trainer** into **Applications**.
            The first time, macOS says it can't check the app: open **System Settings → Privacy & Security**,
            scroll down and click **Open Anyway** (on older macOS: right-click the app → **Open**). After that it opens with a click.
          - **Windows:** download **PvP-Trainer-windows.zip**, extract it, run **PvP Trainer.exe**.

          The app updates the game by itself from here on.
          NOTES
          gh release create "build-$BUILD" PvP-Trainer-mac.zip PvP-Trainer-windows.zip game.html build.json \
            --title "PvP Trainer — build $BUILD" --notes-file notes.md --target "$GITHUB_SHA" --latest
          # Keep the five newest builds.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | tail -n +6 | while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done

      - name: Keep the build (not main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PvP-Trainer-mac
          path: PvP-Trainer-mac.zip
          retention-days: 7
